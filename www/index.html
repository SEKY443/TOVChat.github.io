<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tovchat</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- Username gate: shown until a username is set in localStorage. -->
<div id="gate" class="gate" hidden>
  <div class="gate-box">
    <div class="gate-title">T O V C H A T</div>
    <div class="gate-sub">A TELEGRAM &mdash; SENT BY VOICE &mdash; NO WIRE, NO SERVER</div>
    <div class="gate-field">
      <span class="label">CHOOSE A NAME (1&ndash;16 CHARACTERS)</span>
      <input id="gate-input" class="paper-slot-input" type="text" maxlength="16" autocomplete="off" />
    </div>
    <div id="gate-error" class="gate-error" hidden></div>
    <button id="gate-submit" class="key spacebar" type="button">BEGIN</button>
  </div>
</div>

<!-- Main app -->
<div id="app" class="screen" hidden>

  <div class="paper">
    <div class="masthead">
      <div class="masthead-row">
        <div class="masthead-title">T O V C H A T</div>
        <button id="whoami" class="whoami" type="button" title="Change username"></button>
      </div>
      <hr class="masthead-rule" />
      <div class="masthead-sub">A TELEGRAM &mdash; SENT BY VOICE &mdash; NO WIRE, NO SERVER</div>
    </div>

    <div id="history" class="history" aria-live="polite"></div>
  </div>

  <div class="machine">
    <div class="carriage-label">
      <span id="carriage-status">&#9642; TYPE YOUR MESSAGE &#9642;</span>
    </div>
    <textarea id="text-input" class="paper-slot" rows="1" maxlength="4000" placeholder="Type a message&hellip;"></textarea>
    <div class="keys-row">
      <button class="key mode-key active" data-mode="phone" type="button">PHONE</button>
      <button class="key mode-key" data-mode="fast_air" type="button">FAST AIR</button>
      <button id="listen-key" class="key" type="button">LISTEN</button>
      <button id="send-key" class="key spacebar" type="button">TRANSMIT</button>
    </div>
    <div class="second-row">
      <label class="file-decode-link">
        &#9656; DECODE FROM FILE
        <input id="file-input" type="file" accept="audio/*" hidden />
      </label>
      <span id="footnote" class="footnote">PROTECTED HEADER &middot; SESSION UNENCRYPTED</span>
    </div>
  </div>

</div>

<audio id="bell" src="./bell_sound.wav" preload="auto"></audio>

<script type="module" src="./app.js"></script>
</body>
</html>
