[package]
name = "tovchat-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SEKY443/TOVChat.github.io"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
textovervoice-core = { git = "https://github.com/SEKY443/textovervoice-core", features = ["wasm-browser"] }
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
